<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Spotlight v3</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  #panel {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(25, 25, 25, 0.8);
    padding: 12px 16px;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    box-shadow: 0 0 10px rgba(255,255,255,0.1);
    z-index: 10;
  }

  #panel label { display: inline-block; width: 100px; }
  #panel input { width: 120px; }
  #panel button {
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    padding: 4px 8px;
    margin: 4px;
    border-radius: 6px;
    cursor: pointer;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #002, #000);
  }
</style>
</head>
<body>

<div id="panel">
  <div><label>Beam Size:</label><input id="size" type="range" min="30" max="150" value="80"></div>
  <div><label>Intensity:</label><input id="intensity" type="range" min="0.1" max="1" step="0.05" value="0.4"></div>
  <div><label>Rotation (X):</label><input id="rotation" type="range" min="0.2" max="1" step="0.05" value="0.9"></div>
  <div>
    <button id="undo">⟲ Undo</button>
    <button id="redo">⟳ Redo</button>
  </div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
resize();
window.addEventListener('resize', resize);

const ui = {
  size: document.getElementById('size'),
  intensity: document.getElementById('intensity'),
  rotation: document.getElementById('rotation')
};

const undoBtn = document.getElementById('undo');
const redoBtn = document.getElementById('redo');

let spotlights = [];
let redoStack = [];
let mouse = { x: 0, y: 0, active: false };

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
  mouse.active = true;
});

canvas.addEventListener('mouseleave', () => mouse.active = false);

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const s = new Spotlight(
    x, y,
    parseFloat(ui.size.value),
    parseFloat(ui.intensity.value),
    parseFloat(ui.rotation.value)
  );
  spotlights.push(s);
  redoStack = [];
});

undoBtn.onclick = undo;
redoBtn.onclick = redo;
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'z') undo();
  if (e.ctrlKey && e.key.toLowerCase() === 'y') redo();
});

function undo() {
  if (spotlights.length > 0) redoStack.push(spotlights.pop());
}

function redo() {
  if (redoStack.length > 0) spotlights.push(redoStack.pop());
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

class Spotlight {
  constructor(x, y, size, intensity, rotation) {
    this.x = x;
    this.y = y;
    this.baseWidth = size;
    this.intensity = intensity;
    this.rotation = rotation;
    this.height = y;
    this.particles = this.createParticles();
  }

  createParticles() {
    const arr = [];
    for (let i = 0; i < 30; i++) {
      arr.push({
        angle: Math.random() * Math.PI * 2,
        speed: 0.02 + Math.random() * 0.02
      });
    }
    return arr;
  }

  draw(ctx, ghost = false) {
    const alpha = ghost ? 0.4 : 1.0;
    const beamWidth = this.baseWidth;
    const topY = 0;
    const bottomY = this.y;

    // Beam gradient
    const grad = ctx.createLinearGradient(this.x, topY, this.x, bottomY);
    grad.addColorStop(0, `rgba(255,255,255,0)`);
    grad.addColorStop(0.5, `rgba(255,255,255,${this.intensity * 0.25 * alpha})`);
    grad.addColorStop(1, `rgba(255,255,255,${0.05 * alpha})`);

    // Beam shape
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(this.x - beamWidth / 2, topY);
    ctx.lineTo(this.x + beamWidth / 2, topY);
    ctx.lineTo(this.x + beamWidth / 2, bottomY);
    ctx.lineTo(this.x - beamWidth / 2, bottomY);
    ctx.closePath();
    ctx.fill();

    // Ring + particles
    ctx.save();
    ctx.translate(this.x, bottomY);
    ctx.scale(1, this.rotation);
    const ringRadius = beamWidth / 2;

    // Ring glow
    const ringGrad = ctx.createRadialGradient(0, 0, ringRadius * 0.3, 0, 0, ringRadius * 1.3);
    ringGrad.addColorStop(0, `rgba(255,255,255,${0.9 * alpha})`);
    ringGrad.addColorStop(0.6, `rgba(255,255,255,${0.3 * alpha})`);
    ringGrad.addColorStop(1, `rgba(255,255,255,0)`);

    ctx.fillStyle = ringGrad;
    ctx.beginPath();
    ctx.arc(0, 0, ringRadius * 1.2, 0, Math.PI * 2);
    ctx.fill();

    // Ring edge
    ctx.strokeStyle = `rgba(255,255,255,${0.8 * this.intensity * alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
    ctx.stroke();

    if (!ghost) {
      // Orbit particles on ring perimeter
      for (let i = 0; i < this.particles.length; i++) {
        const p = this.particles[i];
        p.angle += p.speed;

        const px = Math.cos(p.angle) * ringRadius;
        const py = Math.sin(p.angle) * ringRadius * 0.15;
        const flicker = 0.5 + 0.5 * Math.sin(Date.now() * 0.005 + i);

        ctx.fillStyle = `rgba(255,255,255,${0.6 * flicker})`;
        ctx.beginPath();
        ctx.arc(px, py, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore();
  }
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw all spotlights
  for (let s of spotlights) s.draw(ctx);

  // Ghost preview
  if (mouse.active) {
    const preview = new Spotlight(
      mouse.x,
      mouse.y,
      parseFloat(ui.size.value),
      parseFloat(ui.intensity.value),
      parseFloat(ui.rotation.value)
    );
    preview.draw(ctx, true);
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
